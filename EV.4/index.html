<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERCWAR EV.4 Sovereign Framework Explorer</title>
    <link rel="stylesheet" href="style.css?v=6" />
</head>

<body>

<div id="sidebar">
    <div class="sidebar-header">
        <div>
            <h2 class="sidebar-title">Cyborg</h2>
            <div style="font-size: 0.65rem; color: var(--text-muted); margin-top: 2px;">PATH: /xml/</div>
        </div>
        <button class="refresh-btn" onclick="scanServerDirectory()">[SCAN]</button>
    </div>
    <div id="file-tree" class="file-tree">
        <div style="padding: 10px; color: var(--text-muted); font-size: 0.8rem; text-align: center;">Click Scan</div>
    </div>
</div>

<div id="workspace">
    <div class="container">
        <header>
            <h1 id="app-title">MERCWAR EV.4 — SYSTEM INTERFACE</h1>
            <div id="app-volume" style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">VOL: --</div>
        </header>

        <div id="meta-container" class="meta-grid">
            <div class="meta-item"><span class="meta-label">Status:</span> Select volume number from sidebar...</div>
        </div>

        <div id="translation-container"></div>

        <h2 style="font-size: 0.9rem; color: var(--text-telemetry); margin-top: 15px; letter-spacing: 1px;">TELEMETRY LOG CORRIDOR</h2>
        <div id="telemetry-container" class="telemetry-corridor">
            Awaiting telemetry pipeline connection...
        </div>

        <div id="status-bar" class="status-bar">LOG: Ready</div>
    </div>
</div>

<script src="script.js?v=6"></script>

</body>
</html>
