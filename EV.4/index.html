<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERCWAR EV.4 Sovereign Framework Explorer</title>
    <style>
        :root {
            --bg-color: #080b10;
            --panel-bg: rgba(13, 18, 28, 0.85);
            --sidebar-bg: rgba(5, 8, 14, 0.95);
            --border-color: #00f0ff;
            --text-primary: #e0f7fc;
            --text-accent: #00f0ff;
            --text-muted: #5a738e;
            --hover-color: rgba(0, 240, 255, 0.15);
            --active-color: rgba(0, 240, 255, 0.3);
            --glow-color: rgba(0, 240, 255, 0.25);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 220px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px var(--glow-color);
            z-index: 10;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0, 240, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-title {
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .refresh-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-accent);
            cursor: pointer;
            padding: 2px 6px;
            font-family: inherit;
            font-size: 0.75rem;
            border-radius: 2px;
        }

        .refresh-btn:hover {
            background: var(--hover-color);
        }

        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            align-content: start;
        }

        .tree-item {
            padding: 10px 0;
            font-size: 0.95rem;
            color: var(--text-primary);
            cursor: pointer;
            border-radius: 3px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            user-select: none;
        }

        .tree-item:hover {
            background: var(--hover-color);
            border-color: var(--text-accent);
        }

        .tree-item.active {
            background: var(--active-color);
            border-color: var(--border-color);
            color: #ffffff;
            font-weight: bold;
            box-shadow: 0 0 8px var(--glow-color);
        }

        .item-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .item-number {
            font-size: 1.1rem;
            color: var(--text-accent);
            font-weight: bold;
        }

        #workspace {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            border: 1px solid var(--border-color);
            background: var(--panel-bg);
            box-shadow: 0 0 15px var(--glow-color);
            border-radius: 4px;
            padding: 20px;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.3rem;
            color: var(--text-accent);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px;
            border-left: 3px solid var(--text-accent);
            margin-bottom: 20px;
        }

        .meta-item {
            font-size: 0.85rem;
        }

        .meta-label {
            color: var(--text-muted);
            font-weight: bold;
        }

        .translation-block {
            border: 1px solid rgba(0, 240, 255, 0.2);
            margin-bottom: 15px;
            background: rgba(5, 10, 18, 0.6);
            border-radius: 3px;
        }

        .section-header {
            background: rgba(0, 240, 255, 0.1);
            color: var(--text-accent);
            padding: 8px 12px;
            font-size: 0.9rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
        }

        .section-body {
            padding: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .code-block {
            background: #020408;
            color: #00ff66;
            padding: 10px;
            border-radius: 3px;
            font-family: inherit;
            overflow-x: auto;
        }

        .telemetry-corridor {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            font-size: 0.8rem;
            max-height: 200px;
            overflow-y: auto;
            color: var(--text-muted);
        }

        .node-index {
            color: #ffb700;
            margin-bottom: 5px;
        }

        .status-bar {
            margin-top: 15px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: right;
        }

        .error-msg {
            color: #ff3366;
            background: rgba(255, 51, 102, 0.1);
            padding: 10px;
            border: 1px solid #ff3366;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="sidebar-header">
        <div>
            <h2 class="sidebar-title">VOL INDEX</h2>
            <div style="font-size: 0.65rem; color: var(--text-muted); margin-top: 2px;">PATH: /xml/</div>
        </div>
        <button class="refresh-btn" onclick="scanServerDirectory()">[SCAN]</button>
    </div>
    <div id="file-tree" class="file-tree">
        <div style="grid-column: span 2; padding: 10px; color: var(--text-muted); font-size: 0.8rem; text-align: center;">Scanning...</div>
    </div>
</div>

<div id="workspace">
    <div class="container">
        <header>
            <h1 id="app-title">MERCWAR EV.4 — SYSTEM INTERFACE</h1>
            <div id="app-volume" style="color: var(--text-muted); font-size: 0.9rem;">VOL: --</div>
        </header>

        <div id="meta-container" class="meta-grid">
            <div class="meta-item"><span class="meta-label">Status:</span> Select volume number from sidebar...</div>
        </div>

        <div id="translation-container"></div>

        <h2 style="font-size: 1rem; color: var(--text-accent); margin-top: 25px;">TELEMETRY LOG CORRIDOR</h2>
        <div id="telemetry-container" class="telemetry-corridor">
            Awaiting telemetry pipeline connection...
        </div>

        <div id="status-bar" class="status-bar">LOG: Ready</div>
    </div>
</div>

<script>
    const TARGET_DIR = 'xml/';

    // Scans server and parses filenames into clean volume numbers
    async function scanServerDirectory() {
        const treeContainer = document.getElementById('file-tree');
        treeContainer.innerHTML = '<div style="grid-column: span 2; padding: 10px; color: var(--text-muted); font-size: 0.8rem; text-align: center;">Reading...</div>';

        try {
            let response = await fetch('list_files.php').catch(() => null);
            let fileList = [];

            if (response && response.ok) {
                fileList = await response.json();
            } else {
                response = await fetch(TARGET_DIR);
                if (!response.ok) throw new Error(`Directory index inaccessible at '${TARGET_DIR}'`);
                
                const htmlText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                
                const links = Array.from(doc.querySelectorAll('a'));
                fileList = links
                    .map(a => a.getAttribute('href'))
                    .filter(href => href && (href.endsWith('.txt') || href.endsWith('.xml')))
                    .map(href => href.replace(/^.*[\\\/]/, ''));
            }

            renderSidebar(fileList);
        } catch (err) {
            console.warn("Server directory scan error:", err);
            treeContainer.innerHTML = `
                <div style="grid-column: span 2; padding: 10px; color: var(--text-muted); font-size: 0.8rem; text-align: center;">
                    Auto-index off.<br><br>
                    <a href="#" onclick="manualPagePrompt()" style="color: var(--text-accent);">[Enter Page #]</a>
                </div>
            `;
        }
    }

    function extractPageNumber(fileName, index) {
        // Extracts all digits from the filename (e.g. "vol_011.xml" -> "011", "new 1.txt" -> "1")
        const match = fileName.match(/\d+/g);
        if (match) {
            // Join consecutive numbers or take the primary numeric block
            let numStr = match.join('');
            // Format single digits with leading zero for consistent UI alignment (e.g. 1 -> 01)
            return numStr.length === 1 ? '0' + numStr : numStr;
        }
        // Fallback to sequential index if no digits exist in filename
        return String(index + 1).padStart(2, '0');
    }

    function renderSidebar(files) {
        const treeContainer = document.getElementById('file-tree');
        treeContainer.innerHTML = '';

        if (!files || files.length === 0) {
            treeContainer.innerHTML = '<div style="grid-column: span 2; padding: 10px; color: var(--text-muted); font-size: 0.8rem; text-align: center;">No pages found.</div>';
            return;
        }

        // Map files into number objects and sort by numeric sequence
        const pages = files.map((fileName, idx) => ({
            numStr: extractPageNumber(fileName, idx),
            numVal: parseInt(extractPageNumber(fileName, idx), 10) || (idx + 1),
            fileName: fileName
        })).sort((a, b) => a.numVal - b.numVal);

        pages.forEach((page, index) => {
            const item = document.createElement('div');
            item.className = 'tree-item';
            item.id = `page-btn-${index}`;
            const fullPath = TARGET_DIR + page.fileName;

            item.innerHTML = `
                <span class="item-label">PAGE</span>
                <span class="item-number">${page.numStr}</span>
            `;
            
            item.onclick = () => {
                document.querySelectorAll('.tree-item').forEach(el => el.classList.remove('active'));
                item.classList.add('active');
                loadSovereignData(fullPath);
            };

            treeContainer.appendChild(item);
        });

        // Auto-select first available page button
        const first = document.getElementById('page-btn-0');
        if (first) first.click();
    }

    function manualPagePrompt() {
        const pageNum = prompt("Enter page/volume number (e.g., 11):", "011");
        if (pageNum) {
            const formatted = pageNum.padStart(3, '0');
            renderSidebar([`vol_${formatted}.xml`]);
        }
    }

    async function loadSovereignData(filepath) {
        const statusBar = document.getElementById('status-bar');
        try {
            statusBar.innerText = `FETCHING FILE: ${filepath}...`;
            const response = await fetch(filepath);
            if (!response.ok) throw new Error(`HTTP ${response.status}: Failed to load '${filepath}'`);

            const xmlText = await response.text();
            parseAndRenderXML(xmlText, filepath);
        } catch (err) {
            statusBar.innerText = `ERROR: ${err.message}`;
            document.getElementById('translation-container').innerHTML = `
                <div class="error-msg">
                    <strong>Load Failure:</strong> Unable to retrieve <code>${filepath}</code>.
                </div>
            `;
        }
    }

    function parseAndRenderXML(xmlText, sourceName) {
        const statusBar = document.getElementById('status-bar');
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");

        const parserError = xmlDoc.querySelector("parsererror");
        if (parserError) {
            statusBar.innerText = "ERROR: XML Parsing Failed";
            return;
        }

        renderDHTML(xmlDoc);
        statusBar.innerText = `SOURCE: [${sourceName}] LOADED & PARSED OK`;
    }

    function renderDHTML(xml) {
        const root = xml.querySelector("SovereignFramework");
        if (root) {
            document.getElementById('app-title').innerText = `${root.getAttribute("project")} ${root.getAttribute("version")} Sovereign Framework`;
            document.getElementById('app-volume').innerText = `VOL: ${root.getAttribute("volume")}`;
        }

        const meta = xml.querySelector("MetaConfiguration");
        if (meta) {
            document.getElementById('meta-container').innerHTML = `
                <div class="meta-item"><span class="meta-label">Directory Root:</span> ${getNodeText(meta, "DirectoryRoot")}</div>
                <div class="meta-item"><span class="meta-label">Hardware:</span> ${getNodeText(meta, "HardwareAffinity")}</div>
                <div class="meta-item"><span class="meta-label">Hex Signature:</span> ${getNodeText(meta, "VolumeHexSignature")}</div>
                <div class="meta-item"><span class="meta-label">Target Base:</span> ${getNodeText(meta, "TargetSegmentBase")}</div>
            `;
        }

        const pages = xml.querySelectorAll("SubjectPage");
        let translationHTML = '';

        pages.forEach(page => {
            const eng = page.querySelector("EnglishSection");
            const cyborg = page.querySelector("CyborgSection");
            const machine = page.querySelector("MachineSection");

            translationHTML += `
                <div style="margin-bottom: 20px;">
                    <h2 style="font-size: 1.0rem; color: var(--text-accent); border-bottom: 1px dashed var(--text-accent); padding-bottom: 4px;">
                        Vector #${page.getAttribute("id")} — ${page.getAttribute("topic")}
                    </h2>
                    
                    ${eng ? `<div class="translation-block"><div class="section-header">ENGLISH // ${getNodeText(eng, "Title")}</div><div class="section-body">${getNodeText(eng, "Content")}</div></div>` : ''}
                    ${cyborg ? `<div class="translation-block"><div class="section-header">CYBORG // ${getNodeText(cyborg, "Title")}</div><div class="section-body">${getNodeText(cyborg, "Content")}</div></div>` : ''}
                    ${machine ? `<div class="translation-block"><div class="section-header">MACHINE // ${getNodeText(machine, "Title")}</div><div class="section-body"><div class="code-block">${getNodeText(machine, "Content")}</div></div></div>` : ''}
                </div>
            `;
        });

        document.getElementById('translation-container').innerHTML = translationHTML;

        const telemetry = xml.querySelector("TelemetryLogCorridor");
        if (telemetry) {
            let telemetryHTML = '';
            telemetry.querySelectorAll("NodeIndex").forEach(node => {
                telemetryHTML += `<div class="node-index">[NODE ${node.getAttribute("id")}] ${node.textContent}</div>`;
            });

            const padding = telemetry.querySelector("PaddingBlocks");
            if (padding) {
                telemetryHTML += `<div style="color: var(--text-muted); margin-top: 8px;">${padding.textContent.trim().replace(/\n/g, '<br>')}</div>`;
            }

            document.getElementById('telemetry-container').innerHTML = telemetryHTML;
        }
    }

    function getNodeText(parent, selector) {
        const el = parent.querySelector(selector);
        return el ? el.textContent : 'N/A';
    }

    window.addEventListener('DOMContentLoaded', () => {
        scanServerDirectory();
    });
</script>

</body>
</html>
